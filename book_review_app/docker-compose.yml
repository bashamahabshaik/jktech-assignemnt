version: '3.9'

services:
  web:
    build: .
    container_name: book-app
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      - db
    extra_hosts:
      - "host.docker.internal:host-gateway" 

  db:
    image: postgres:15
    container_name: postgres-db01
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: booksdb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
